<!-- /apps/yourproj/components/blogpost/blogpost.html -->
<div class="blog-post" data-sly-use.blog="Lakshmi.core.models.BlogPost">

  <!-- Title -->
  <sly data-sly-test="${blog.title}">
    <h1 class="blog-post__title">${blog.title}</h1>
  </sly>

  <!-- Date -->
  <sly data-sly-test="${blog.date}">
    <time class="blog-post__date" datetime="${blog.date}">${blog.date}</time>
  </sly>

  <!-- Image -->
  <sly data-sly-test="${blog.image}">
    <figure class="blog-post__figure">
      <img
        class="blog-post__image"
        src="${blog.image @ context='uri'}"
        alt="${blog.title}"
        loading="lazy" />
    </figure>
  </sly>

  <!-- Body (rich text allowed) -->
  <sly data-sly-test="${blog.blogcontent}">
    <div class="blog-post__content">
      ${blog.blogcontent @ context='html'}
    </div>
  </sly>

</div>
